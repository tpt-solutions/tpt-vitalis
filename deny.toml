# cargo-deny configuration for tpt-vitalis.
# See https://embarkstudios.github.io/cargo-deny/ for reference.

[advisories]
version = 2
yanked = "warn"
# `instant` is unmaintained with no safe upgrade; it is pulled in only
# transitively via reed-solomon-erasure's old parking_lot. We accept it.
ignore = [
    # `instant` is unmaintained with no safe upgrade; pulled in only transitively
    # via reed-solomon-erasure's old parking_lot.
    "RUSTSEC-2024-0384",
    # `atomic-polyfill` is unmaintained with no safe upgrade; pulled in
    # transitively via postcard -> heapless. Only affects no_std paths.
    "RUSTSEC-2023-0089",
]

[licenses]
version = 2
# Allow MIT/Apache-2.0 and the common permissive licenses that are
# compatible with the project's dual MIT OR Apache-2.0 license.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
